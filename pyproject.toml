[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2,<10"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">= 3.6"
name = 'alibuild'
dynamic = ['readme', 'version']
description = 'ALICE Build Tool'
keywords = ['HEP', 'ALICE']
license = { file = 'LICENSE' }
authors = [
  {name = 'Giulio Eulisse', email = 'giulio.eulisse@cern.ch'},
  {name = 'Timo Wilken', email = 'timo.wilken@cern.ch'},
  {name = 'Sergio Garcia', email = 'sergio.garcia@cern.ch'},
]

classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Topic :: Software Development :: Build Tools',
]

dependencies = [
  'pyyaml',
  'requests',
  'distro',
  'jinja2',
  'boto3',
]

[project.optional-dependencies]
test = [
'tox',
]
docs = [
'mkdocs',
'mkdocs-material',
'mkdocs-redirects',
]
# Ed25519 signing of reapi:// Action Cache entries. Imported lazily, so the core
# tool works without it -- but keep this in sync with setup.py's extras_require:
# because [project] exists here, this table is what the built metadata advertises.
signing = [
'cryptography',
]

[project.urls]
homepage = 'https://alisw.github.io/alibuild'

[tool.setuptools]
script-files = ["aliBuild", "alienv", "aliDoctor", "aliDeps", "pb"]

[tool.setuptools_scm]
write_to = "alibuild_helpers/_version.py"

[tool.setuptools.package-data]
alibuild_helpers = ['build_template.sh', 'completions/*.sh', 'keyring.json']

[tool.setuptools.packages.find]
where = ["."]
exclude = ["yaml"]

[tool.setuptools.dynamic]
readme = {file = ["README.rst"]}
